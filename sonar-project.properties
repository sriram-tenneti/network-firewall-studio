sonar.projectKey=sriram-tenneti_network-firewall-studio
sonar.projectName=Network Firewall Studio
sonar.projectVersion=1.0

sonar.sources=firewall-studio-backend/app,firewall-studio-frontend/src
sonar.tests=firewall-studio-backend/tests,firewall-studio-frontend/tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=firewall-studio-backend/coverage.xml
sonar.javascript.lcov.reportPaths=firewall-studio-frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=firewall-studio-frontend/tsconfig.json

sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.min.js,**/data/**,**/seed-json/**,**/app/config/*.json
sonar.test.exclusions=**/node_modules/**,**/dist/**

sonar.coverage.exclusions=\
  **/tests/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/main.tsx,\
  **/vite.config.ts,\
  **/eslint.config.js,\
  **/postcss.config.js,\
  **/tailwind.config.js,\
  **/seed_data.py,\
  **/mongodb.py

sonar.cpd.exclusions=**/seed_data.py,**/database.py,**/app/config/**
